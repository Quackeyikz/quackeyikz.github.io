<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkir PENS — Where Did I Park?</title>
  <meta name="description" content="Personal parking spot tracker for PENS campus. Remember where you parked.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-icon">🅿️</div>
      <h1>Parkir PENS</h1>
      <p class="subtitle">Tap your spot. Never forget.</p>
    </header>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner hidden">
      <div class="status-content">
        <span class="status-icon">📍</span>
        <span id="status-text">You parked at <strong id="status-spot">—</strong></span>
        <span id="status-time" class="status-time"></span>
      </div>
      <button id="btn-clear" class="btn-clear" title="Clear selection">✕</button>
    </div>

    <!-- Parking Grid -->
    <main class="grid-wrapper">
      <div class="grid-label">
        <span class="grid-label-icon">🔽</span> Tap a spot to select
      </div>
      <div id="parking-grid" class="parking-grid">
        <!-- Spots injected by JS -->
      </div>
    </main>

    <!-- Confirm Action -->
    <div id="confirm-bar" class="confirm-bar hidden">
      <span id="confirm-text">Park at <strong id="confirm-spot">—</strong>?</span>
      <div class="confirm-actions">
        <button id="btn-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-confirm" class="btn btn-primary">Confirm</button>
      </div>
    </div>

    <!-- Reset -->
    <div class="reset-section">
      <button id="btn-reset" class="btn-reset" title="Clear all saved data and reset">
        <span class="reset-icon">🗑️</span> Reset All Data
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Data saved locally in your browser only.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
